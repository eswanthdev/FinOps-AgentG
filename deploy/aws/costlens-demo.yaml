AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  CostLens synthetic demo. One private EC2 server behind an HTTPS load balancer with Cognito login.
  Synthetic data only. Not validated against AWS yet. See RUNBOOK.md.

Parameters:
  DomainName:
    Type: String
    Description: Hostname users will open, for example costlens.example.com
    AllowedPattern: "^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$"
  CertificateArn:
    Type: String
    Description: ACM certificate for DomainName, in this region
    AllowedPattern: "^arn:aws:acm:.+"
  ImageUri:
    Type: String
    Description: Full image URI with a version tag, from the costlens ECR repository
  RepositoryArn:
    Type: String
    Description: ARN of the costlens ECR repository
    AllowedPattern: "^arn:aws:ecr:.+"
  CognitoDomainPrefix:
    Type: String
    Description: Globally unique prefix for the Cognito sign-in page
    AllowedPattern: "^[a-z0-9-]{3,40}$"
  BudgetEmail:
    Type: String
    Description: Who gets the monthly cost alert
  BedrockModelId:
    Type: String
    Default: anthropic.claude-opus-5-5
    Description: Model the investigator uses
  BedrockModelArn:
    Type: String
    Description: ARN of that model, from the Bedrock console. The server role can call this model only.
    AllowedPattern: "^arn:aws:bedrock.*"
  MonthlyBudgetUsd:
    Type: Number
    Default: 60
    MinValue: 1
    MaxValue: 500
  InstanceType:
    Type: String
    Default: t3.small
    AllowedValues: [t3.small, t3.medium]
  LatestAmi:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.60.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: costlens-demo }]
  InternetGateway:
    Type: AWS::EC2::InternetGateway
  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway
  SubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.60.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
  SubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.60.2.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
  SubnetARoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SubnetA
      RouteTableId: !Ref RouteTable
  SubnetBRoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SubnetB
      RouteTableId: !Ref RouteTable

  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public HTTPS, and HTTP that only redirects to HTTPS
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0 }
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0 }
  # The app has no login of its own. This rule is what makes the load balancer the only way in.
  ServerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: App port from the load balancer only. No SSH.
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8765
          ToPort: 8765
          SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup

  ServerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: costlens-server
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action: [ecr:BatchCheckLayerAvailability, ecr:BatchGetImage, ecr:GetDownloadUrlForLayer]
                Resource: !Ref RepositoryArn
              - Effect: Allow
                Action: bedrock-mantle:CreateInference
                Resource: !Ref BedrockModelArn
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "${LogGroup.Arn}:*"
  ServerProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref ServerRole]
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /costlens/demo
      RetentionInDays: 30

  ServerTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        MetadataOptions:
          HttpTokens: required
          HttpPutResponseHopLimit: 2  # the container needs the server role, for the Bedrock call
  Server:
    Type: AWS::EC2::Instance
    DependsOn: DefaultRoute
    Properties:
      ImageId: !Ref LatestAmi
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref ServerProfile
      LaunchTemplate:
        LaunchTemplateId: !Ref ServerTemplate
        Version: !GetAtt ServerTemplate.LatestVersionNumber
      NetworkInterfaces:
        - DeviceIndex: "0"
          SubnetId: !Ref SubnetA
          AssociatePublicIpAddress: true  # outbound only, to avoid NAT cost; the security group allows no direct inbound
          GroupSet: [!Ref ServerSecurityGroup]
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs: { VolumeSize: 20, VolumeType: gp3, Encrypted: true, DeleteOnTermination: true }
      Tags:
        - { Key: Name, Value: costlens-demo }
        - { Key: Backup, Value: costlens-daily }
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail
          dnf install -y docker
          systemctl enable --now docker
          mkdir -p /data
          chown 10001:10001 /data
          registry="$(echo '${ImageUri}' | cut -d/ -f1)"
          aws ecr get-login-password --region ${AWS::Region} | docker login --username AWS --password-stdin "$registry"
          docker run -d --name costlens --restart unless-stopped -p 8765:8765 -v /data:/data \
            -e COSTLENS_BEHIND_AUTH_PROXY=true -e COSTLENS_ALLOWED_HOSTS=${DomainName} -e COSTLENS_LOG_LEVEL=INFO \
            -e COSTLENS_MODEL_PROVIDER=bedrock -e COSTLENS_BEDROCK_REGION=${AWS::Region} -e COSTLENS_BEDROCK_MODEL=${BedrockModelId} \
            --log-driver awslogs --log-opt awslogs-region=${AWS::Region} --log-opt awslogs-group=${LogGroup} \
            '${ImageUri}'

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: costlens-demo
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      MfaConfiguration: "OFF"
      Policies:
        PasswordPolicy: { MinimumLength: 12, RequireLowercase: true, RequireUppercase: true, RequireNumbers: true, RequireSymbols: true }
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref CognitoDomainPrefix
      UserPoolId: !Ref UserPool
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      GenerateSecret: true
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email]
      SupportedIdentityProviders: [COGNITO]
      CallbackURLs: [!Sub "https://${DomainName}/oauth2/idpresponse"]

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    DependsOn: GatewayAttachment
    Properties:
      Scheme: internet-facing
      Type: application
      SecurityGroups: [!Ref LoadBalancerSecurityGroup]
      Subnets: [!Ref SubnetA, !Ref SubnetB]
      LoadBalancerAttributes:
        - { Key: routing.http.drop_invalid_header_fields.enabled, Value: "true" }
  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref Vpc
      Protocol: HTTP
      Port: 8765
      TargetType: instance
      Targets: [{ Id: !Ref Server }]
      HealthCheckPath: /healthz
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: HTTPS
      Port: 443
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates: [{ CertificateArn: !Ref CertificateArn }]
      DefaultActions:
        - Type: authenticate-cognito
          Order: 1
          AuthenticateCognitoConfig:
            UserPoolArn: !GetAtt UserPool.Arn
            UserPoolClientId: !Ref UserPoolClient
            UserPoolDomain: !Ref UserPoolDomain
            OnUnauthenticatedRequest: authenticate
        - Type: forward
          Order: 2
          TargetGroupArn: !Ref TargetGroup
  HttpRedirect:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: redirect
          RedirectConfig: { Protocol: HTTPS, Port: "443", StatusCode: HTTP_301 }

  SnapshotRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: dlm.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSDataLifecycleManagerServiceRole
  DailySnapshots:
    Type: AWS::DLM::LifecyclePolicy
    Properties:
      Description: Daily snapshot of the CostLens demo server kept for 7 days  # AWS allows only letters, digits, spaces, _ and -
      State: ENABLED
      ExecutionRoleArn: !GetAtt SnapshotRole.Arn
      PolicyDetails:
        ResourceTypes: [INSTANCE]
        TargetTags: [{ Key: Backup, Value: costlens-daily }]
        Schedules:
          - Name: daily
            CreateRule: { Interval: 24, IntervalUnit: HOURS, Times: ["20:00"] }
            RetainRule: { Count: 7 }

  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: costlens-demo
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: { Amount: !Ref MonthlyBudgetUsd, Unit: USD }
      NotificationsWithSubscribers:
        - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 80, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref BudgetEmail }]

Outputs:
  LoadBalancerDns:
    Description: Point DomainName at this with a CNAME record
    Value: !GetAtt LoadBalancer.DNSName
  UserPoolId:
    Value: !Ref UserPool
  ServerId:
    Value: !Ref Server
