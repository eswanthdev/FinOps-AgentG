AWSTemplateFormatVersion: "2010-09-09"
Description: CostLens image repository. Deploy this first, push the image, then deploy costlens-demo.yaml.

Resources:
  Repository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: costlens
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: >-
          {"rules":[{"rulePriority":1,"description":"Keep the last 5 images",
          "selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":5},
          "action":{"type":"expire"}}]}

Outputs:
  RepositoryUri:
    Value: !GetAtt Repository.RepositoryUri
  RepositoryArn:
    Value: !GetAtt Repository.Arn
